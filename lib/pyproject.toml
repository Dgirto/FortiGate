[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-fortigate-connector"
version = "1.0.0"
description = "Conector Ruvic de administración de políticas y objetos para FortiGate"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
    "urllib3>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_fortigate_connector*"]
